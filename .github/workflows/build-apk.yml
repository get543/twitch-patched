name: Build Patched APK

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct download URL for Twitch APK/APKM (Optional - leave empty to auto-download 31.6.0 from APKMirror)'
        required: false
        type: string
  push:
    branches: [dev, main]

jobs:
  build-apk:
    name: Build Patched APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Check source hygiene
        shell: pwsh
        run: ./scripts/check-source.ps1

      - name: Ensure Android SDK Platform 36
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'

      - name: Bootstrap Morphe tools
        shell: pwsh
        run: ./scripts/bootstrap-tools.ps1

      - name: Build patch bundle (.mpp)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew clean :patches:buildAndroid :patches:generatePatchesList --console=plain --no-daemon
          if ($LASTEXITCODE -ne 0) {
              throw "Gradle patch bundle build failed with exit code $LASTEXITCODE."
          }

      - name: Download Twitch 31.7.0 from APKMirror
        uses: Yakov5776/gh-apkmirror-dl@v1.3
        continue-on-error: true
        with:
          org: 'twitch-interactive-inc'
          repo: 'twitch'
          version: '31.7.0'
          bundle: true
          filename: 'twitch.apkm'

      - name: Obtain Twitch APK / APKM Fallback
        if: hashFiles('twitch.apkm', 'twitch.apk') == ''
        shell: pwsh
        env:
          INPUT_URL: ${{ inputs.apk_url }}
          SECRET_URL: ${{ secrets.TWITCH_APK_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $url = $env:INPUT_URL
          if (-not $url) { $url = $env:SECRET_URL }
          if ($url) {
              Write-Host "Downloading Twitch APK/APKM from provided URL..."
              Invoke-WebRequest -Uri $url -OutFile "twitch.apkm"
          } else {
              Write-Host "No Twitch APK download source available and no local file found."
              Write-Host "Skipping APK patching step. (.mpp bundle was built successfully)"
          }

      - name: Patch APK with Morphe
        if: hashFiles('twitch.apkm', 'twitch.apk') != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $patchNames = @(
              "Landscape edge-to-edge playback",
              "Clip-style chat animation",
              "Auto-claim bonus channel points",
              "BTTV, FFZ and 7TV emotes",
              "Block client-requested ads",
              "Block stream ads",
              "Hide Turbo promotions",
              "Hide feed and display ads",
              "Hide subscription discount banners",
              "Reload stream"
          )
          $inputApk = if (Test-Path "twitch.apkm") { "twitch.apkm" } else { "twitch.apk" }
          ./scripts/patch.ps1 -InputApk $inputApk -Patch $patchNames
          if ($LASTEXITCODE -ne 0) {
              throw "Morphe patching failed with exit code $LASTEXITCODE."
          }

          $latestRun = Get-ChildItem -Path ".local/runs" -Directory | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $latestRun) {
              throw "Morphe did not create a run directory under .local/runs."
          }
          $patched = Get-ChildItem -Path $latestRun.FullName -Filter "*patched*.apk" | Select-Object -First 1
          if (-not $patched) {
              throw "Morphe did not produce a patched APK in $($latestRun.FullName)."
          }
          Copy-Item -Path $patched.FullName -Destination "twitch_patched.apk" -Force
          Write-Host "Successfully generated twitch_patched.apk"

      - name: Upload Patched APK Artifact
        if: hashFiles('twitch_patched.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: twitch_patched.apk
          path: twitch_patched.apk
          retention-days: 14
