name: Build Patches & APK

on:
  workflow_dispatch:
  push:
    branches: [dev, main]

jobs:
  build-apk:
    name: Build Patched APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Check source hygiene
        shell: pwsh
        run: ./scripts/check-source.ps1

      - name: Ensure Android SDK Platform 36
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'

      - name: Bootstrap Morphe tools
        shell: pwsh
        run: ./scripts/bootstrap-tools.ps1

      - name: Build patch bundle (.mpp)
        id: bundle
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew clean :patches:buildAndroid :patches:generatePatchesList --console=plain --no-daemon
          if ($LASTEXITCODE -ne 0) {
              throw "Gradle patch bundle build failed with exit code $LASTEXITCODE."
          }
          $versionLine = @(Get-Content "gradle.properties" | Where-Object { $_ -match '^version\s*=' })
          if ($versionLine.Count -ne 1) {
              throw "Expected exactly one version property in gradle.properties."
          }
          $version = ($versionLine[0] -split '=', 2)[1].Trim()
          $bundlePath = "patches/build/libs/patches-$version.mpp"
          if (-not (Test-Path -LiteralPath $bundlePath)) {
              throw "Expected patch bundle was not produced: $bundlePath"
          }
          "path=$bundlePath" | Add-Content -Path $env:GITHUB_OUTPUT
          "version=$version" | Add-Content -Path $env:GITHUB_OUTPUT

      - name: Download Twitch from APKMirror
        uses: Yakov5776/gh-apkmirror-dl@v1.3
        with:
          org: 'twitch-interactive-inc'
          repo: 'twitch'
          version: '31.7.0'
          bundle: true
          filename: 'twitch.apkm'

      - name: Patch APK with Morphe
        if: hashFiles('twitch.apkm', 'twitch.apk') != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $patchNames = @(
              "Landscape edge-to-edge playback",
              "Clip-style chat animation",
              "Auto-claim bonus channel points",
              "BTTV, FFZ and 7TV emotes",
              "Block client-requested ads",
              "Block stream ads",
              "Hide Turbo promotions",
              "Hide feed and display ads",
              "Hide subscription discount banners",
              "Reload stream"
          )
          $inputApk = if (Test-Path "twitch.apkm") { "twitch.apkm" } else { "twitch.apk" }
          ./scripts/patch.ps1 -InputApk $inputApk -Patch $patchNames
          if ($LASTEXITCODE -ne 0) {
              throw "Morphe patching failed with exit code $LASTEXITCODE."
          }

          $latestRun = Get-ChildItem -Path ".local/runs" -Directory | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $latestRun) {
              throw "Morphe did not create a run directory under .local/runs."
          }
          $patched = Get-ChildItem -Path $latestRun.FullName -Filter "*patched*.apk" | Select-Object -First 1
          if (-not $patched) {
              throw "Morphe did not produce a patched APK in $($latestRun.FullName)."
          }
          Copy-Item -Path $patched.FullName -Destination "twitch_patched.apk" -Force
          Write-Host "Successfully generated twitch_patched.apk"

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v${{ steps.bundle.outputs.version }}
          name: Release v${{ steps.bundle.outputs.version }}
          body: |
            Automated build release containing:
            - Morphe Patch Bundle (`.mpp`)
            - Patched Twitch APK (`twitch_patched.apk`)
          files: |
            ${{ steps.bundle.outputs.path }}
            twitch_patched.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}